# 1.2.52 secret scanning (CI job "Secrets", docs/SECURITY_AUDIT.md). Extends gitleaks' default rules.
title = "SharkyClips gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Reviewed false positives"
paths = [
  '''^frontend/dist/''',          # minified build output (the sources in frontend/src are scanned)
  '''^frontend/node_modules/''',
  '''^\.venv/''',
]
regexes = [
  '''kimne78kx3ncx6brgo4mv6wki5h1ko''',   # Twitch's public web client id (sent by every twitch.tv page)
  '''[0-9a-f]{64}''',                     # SHA-256 checksums of model downloads
  '''FAKE[A-Za-z0-9_\-]*''',               # test placeholders
]

[[allowlists]]
# 1.2.53: UI text "Turn on the YouTube API" in the es / pt / fr locales reads like "API = <value>"
# to the generic-api-key rule. Only these phrases, only in the locale files.
description = "UI text about the YouTube API in the translations"
condition = "AND"
paths = ['''^frontend/src/i18n/locales/[a-z]{2}\.ts$''']
regexTarget = "match"
regexes = ['''(?i)API (de |do )?YouTube''', '''(?i)l'API YouTube''']
